<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Food Store</title>
    <!-- Usamos el mismo CSS del login para que se vea igual de bien -->
    <link rel="stylesheet" href="/css/login.css">
    <script type="module" src="/src/main.ts"></script>
</head>
<body>

    <div class="login-container">
        <h1>Food Store</h1>
        <h2>Crear Cuenta</h2>
        
        <form id="form-registro">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
            </div>
            
            <button type="submit">REGISTRARME<a href="/src/pages/auth/login/login.html"></a></button>
        </form>

        <p class="enlace-registro">¿Ya tenés cuenta? <a href="/src/pages/auth/login/login.html">Iniciar sesión acá</a></p>
    </div>

    <!-- Conexión a TypeScript -->
    <script type="module" src="./registro.ts"></script>
</body>
</html>
