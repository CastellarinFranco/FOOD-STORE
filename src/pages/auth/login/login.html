<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Store</title>
    <!-- Vinculación a la hoja de estilos -->
    <link rel="stylesheet" href="/css/login.css">
    
</head>


<body>

    <div class="login-container">
        <h1>Food Store</h1>
        <h2>Iniciar Sesión</h2>
        
        <form>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
            </div>
            
            <button type="submit">INGRESAR</button>
        </form>

        <p class="enlace-registro">¿No tenés cuenta? <a href="/src/pages/auth/registro/registro.html">Registrate acá</a></p>
        <p class="enlace-registro">¿Querés ver la tienda? <a href="/index.html">Saltear login</a></p>
    </div>
<script type="module" src="./login.ts"></script>
</body>
</html>
